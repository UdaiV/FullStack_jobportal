{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Skillhunt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{%  static '/css/styles.css' %}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-center mb-4"><a href="home.html" class="h2 font-weight-bold text-dark text-decoration-none">Skill<span class="text-primary">hunt</span></a></div>
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="h5 font-weight-bold mb-4 text-center">Company Registration</h3>
                    <form method="POST" action="{% url 'companyuser' %}">
                        {% csrf_token %}
                        <center>
                            <div class="col-md-6">
                                <div class="custom-select-wrapper">
                                    <label class="small font-weight-bold text-muted">Select Role <span class="text-danger">* </span></label>
                                    <select name="role" class="skillhunt-select">
                                         <option disabled selected>_____Select Role________</option>
                                         <option >Company</option>
                                    </select>
                                      <i class="fa-solid fa-chevron-down select-icon-overlay"></i>
                                </div>

                            </div>
                        </center>
                        <div class="form-group"><label class="small font-weight-bold text-muted">First Name <span class="required" style="color: red;">*</span></label><input type="text" class="form-control" placeholder="FirstName" name="fname" required><label class="small font-weight-bold text-muted">Last Name <span class="required" style="color: red;">*</span> </label><input type="text" class="form-control" placeholder="LastName" name="lname" required></div>
                        <div class="form-group"><label class="small font-weight-bold text-muted">Email Address <span class="required" style="color: red;">*</span></label><input type="email" class="form-control" placeholder="Email" name="email" required></div>
                        <div class="form-group"><label class="small font-weight-bold text-muted">Password <span class="required" style="color: red;">*</span></label><input type="password" class="form-control" placeholder="Password" name="password" required><label class="small font-weight-bold text-muted">Confirm Password <span class="required" style="color: red;">*</span></label><input type="password" class="form-control" placeholder="Confirm Password" name="cpassword" required></div>
                         <div class="form-group"><input type="checkbox"><label for="Termsandconditions" style="margin-left: 10px;"> I Accept <a href="">Terms And Conditions</a></label></div>
                        <button type="submit" class="btn btn-primary btn-block py-2 font-weight-bold">Sign Up</button>
                    </form>
                    <p class="small text-muted text-center mt-3 mb-0">Already registered? <a href="login.html">Log In</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
