{% extends "app/base1.html" %}
{% block content %}
{% load static %}




<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Skillhunt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{%  static '/css/styles.css' %}">
</head>
<body class="bg-light"></body>

    <div class="container py-5">
        <div class="card border-0 shadow-sm overflow-hidden bg-white">
            <div class="row no-gutters">
                <div class="col-md-5 bg-dark text-white p-5 d-flex flex-column justify-content-between">
                    <div>
                        <h3 class="h4 font-weight-bold mb-4">Contact Info</h3>
                        <p class="text-light small">Have questions? Reach out directly and our support team will respond within 24 hours.</p>
                    </div>
                    <div class="small">
                        <p class="mb-1"><strong>Email:</strong> support@skillhunt.com</p>
                        <p class="mb-0"><strong>HQ:</strong> 100 Innovation Way, CA</p>
                    </div>
                </div>
                <div class="col-md-7 p-5">
                    <h3 class="h4 font-weight-bold mb-4 text-dark">Send Us A Message</h3>
                    <form>
                        <div class="form-group"><label class="small font-weight-bold text-muted">Full Name</label><input type="text" class="form-control" required></div>
                        <div class="form-group"><label class="small font-weight-bold text-muted">Message Body</label><textarea class="form-control" rows="4" required></textarea></div>
                        <button type="submit" class="btn btn-primary px-4 py-2 font-weight-bold">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
{% endblock %}
