{% extends 'app/company/base1.html' %}
{% load static %}

{% block content %}
<div id="layoutSidenav_content">
    <main>
        <div class="container-fluid px-4 mt-4">
            <h1 class="mt-4">Company Profile</h1>
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
                <li class="breadcrumb-item active">Company Profile</li>
            </ol>

            <div class="row">
                <div class="col-xl-8">
                    <!-- Account details card-->
                    <div class="card mb-4 border-0 shadow-sm">
                        <div class="card-header bg-dark text-white py-3">
                            <i class="fas fa-building me-1"></i> Edit Profile Details
                        </div>
                        <div class="card-body p-4">
                            <!-- CRITICAL: enctype="multipart/form-data" allows files to stream via request.FILES -->
                            <form method="POST" enctype="multipart/form-data" action="{% url 'companyprofileupdate' pk=request.session.id %}">
                                {% csrf_token %}
                               
                                <!-- Form Row-->
                                  <div class="col-md-12">
                                        <label class="small mb-1" for="compname">Company name</label>
                                        <input class="form-control" id="inputcompname" name="compname" type="text" placeholder="Enter Company name" value="{{comp.CompanyName}}">
                                    </div>
                                <div class="row gx-3 mb-3">
                                   
                                    <!-- First name input-->
                                    <div class="col-md-6">
                                        <label class="small mb-1" for="inputFirstName">First name</label>
                                        <input class="form-control" id="inputFirstName" name="firstname" type="text" placeholder="Enter first name" value="{{ comp.FirstName}}">
                                    </div>
                                    <!-- Last name input-->
                                    <div class="col-md-6">
                                        <label class="small mb-1" for="inputLastName">Last name</label>
                                        <input class="form-control" id="inputLastName" name="lastname" type="text" placeholder="Enter last name" value="{{ comp.LastName}}">
                                    </div>
                                </div>

                                <!-- Form Row -->
                                <div class="row gx-3 mb-3">
                                    <!-- Email input-->
                                    <div class="col-md-6">
                                        <label class="small mb-1" for="inputEmailAddress">Email address</label>
                                        <input class="form-control" id="inputEmailAddress" name="email" type="email" placeholder="Enter email address" value="{{ user.Email}}">
                                    </div>
                                    <!-- Contact input-->
                                    <div class="col-md-6">
                                        <label class="small mb-1" for="inputPhone">Contact Number</label>
                                        <input class="form-control" id="inputPhone" name="contact" type="tel" placeholder="Enter phone number" value="{{comp.Comp_Contact}}">
                                    </div>
                                </div>

                                <!-- Form Row-->
                                <div class="row gx-3 mb-3">
                                    <!-- City input-->
                                    <div class="col-md-6">
                                        <label class="small mb-1" for="inputCity">City</label>
                                        <input class="form-control" id="inputCity" name="city" type="text" placeholder="Enter city" value="{{comp.City}}">
                                    </div>
                                    <!-- State input-->
                                    <div class="col-md-6">
                                        <label class="small mb-1" for="inputState">State</label>
                                        <input class="form-control" id="inputState" name="state" type="text" placeholder="Enter state" value="{{comp.State}}">
                                    </div>
                                </div>

                                <!-- Website link input-->
                                <div class="mb-3">
                                    <label class="small mb-1" for="inputWebsite">Website URL</label>
                                    <input class="form-control" id="inputWebsite" name="website" type="url" placeholder="https://example.com" value="{{comp.Comp_web}}">
                                </div>

                                <!-- Description textarea-->
                                <div class="mb-3">
                                    <label class="small mb-1" for="inputDescription">company Description</label>
                                    <textarea class="form-control" id="inputDescription" name="description" rows="4" placeholder="Describe your organization here..." >{{comp.Comp_description}}</textarea>
                                </div>

                                <!-- Logo Image uploading input wrapper -->
                                <div class="mb-4">
                                    <label class="small mb-1" for="inputLogo">Company Logo Image</label>
                                    <input class="form-control" id="inputLogo" name="logo_image" type="file">
                                </div>

                                <!-- Save changes button-->
                                <button class="btn btn-primary px-4" type="submit">Save Changes</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Preview Box Sidebar Column -->
                <div class="col-xl-4">
                    <div class="card mb-4 border-0 shadow-sm text-center">
                        <div class="card-header bg-dark text-white py-3">Current Logo Preview</div>
                        <div class="card-body p-4">
                            <!-- Circular Avatar Container component matching your style -->
                            <div class="card border-0 shadow-sm bg-white mx-auto mb-3" style="border-radius: 50%; width: 120px; height: 120px; overflow: hidden; display: inline-block;">
                                {% if comp.Logo_pic  %}
                                    <!-- Handled dynamically by prepending path slash context safely -->
                                    <img src="{{ comp.Logo_pic.url }}" alt="Company Logo" style="width: 100%; height: 100%; object-fit: cover;">
                                {% else %}
                                    <img src="{% static 'company/img/default-logo.png' %}" alt="Default Logo placeholder" style="width: 100%; height: 100%; object-fit: cover;">
                                {% endif %}
                            </div>
                            <div class="small font-italic text-muted mb-2">JPG or PNG no larger than 2MB</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
{% endblock %}
