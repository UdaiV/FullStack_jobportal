{% extends "app/Admin/base.html" %}
{% load static %}

{% block content %} 

<div class="d-flex align-items-center justify-content-center min-vh-75 w-100 py-4">
<div class="card shadow-sm border-0 my-4" style="max-width: 500px; margin: 0 auto;">
    <div class="card-body p-4">
        <!-- Title & Subtitle -->
        <h4 class="card-title mb-1 text-primary fw-bold">Company Verify</h4>
        <p class="card-text text-muted small mb-4">Update the verification status of this company.</p>

        <!-- Status Form -->
        <form method="POST" action="{% url 'verifypage' pk=company.id %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="verificationStatus" class="form-label fw-semibold text-secondary">Verification Status</label>
                <select class="form-select form-select-lg" id="verificationStatus" name="verify">
                    <!-- Options set to True or False strings/booleans -->
                     <option disabled selected >Select Value</option>
                    <option >True</option>
                    <option >False</option>
                </select>
            </div>

            <!-- Action Buttons -->
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary px-4">Update Status</button>
            </div>
        </form>
        
       </div>
    </div>

</div>
     {%endblock%}
