{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skillhunt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{%  static '/css/styles.css' %}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4"><a href="index.html" class="h2 font-weight-bold text-dark text-decoration-none">Skill<span class="text-primary">hunt</span></a></div>
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="h5 font-weight-bold mb-4 text-center">Login</h3>
                    {% if msg %}
                    <center><span style="color: red; font-weight:bold">{{msg}}</span></center>
                    {% endif %}
                    <form method="POST" action="{% url 'loginuser' %}">
                        {% csrf_token %}
                        <center>
                            <div class="col-md-6">
                                <div class="custom-select-wrapper">
                                    <label class="small font-weight-bold text-muted">Select Role <span class="text-danger">* </span></label>
                                    <select name="role" class="skillhunt-select">
                                         <option disabled selected>__Select Role__</option>
                                        <option >Candidate</option>
                                         <option >Company</option>
                                    </select>
                                      <i class="fa-solid fa-chevron-down select-icon-overlay"></i>
                                </div>

                            </div>
                        </center>
                        <div class="form-group"><label class="small font-weight-bold text-muted">Email</label><input type="email" class="form-control" name="email" required></div>
                        <div class="form-group"><label class="small font-weight-bold text-muted">Password</label><input type="password" class="form-control" name="password" required></div>
                         <div class="form-group"><input type="checkbox"  required><label class="small font-weight-bold text-muted" style="margin-left: 10px;"> Remember me</label><label class="small font-weight-bold text-muted" style="margin-left: 150px;">Forgot password ?</label></div>
                        <button type="submit" class="btn btn-primary btn-block py-2 mt-4 font-weight-bold">Log In</button>
                    </form>
                    <p class="small text-muted text-center mt-3 mb-0">Don't have an account? <a href="{% url 'signup' %}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
